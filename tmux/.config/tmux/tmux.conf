# ── General ───────────────────────────────────────────────────────────────────
set -g history-limit 50000
set -g base-index 1           # start window numbering from 1
setw -g pane-base-index 1     # start pane numbering from 1
set -g renumber-windows on    # renumber windows when one is closed
set -g escape-time 10         # reduce escape key delay (important for vim)
set -g focus-events on        # pass focus events through (for vim autoread)

# ── Appearance ────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # true color support

# ── Prefix ────────────────────────────────────────────────────────────────────
# Keep default C-b; uncomment below to change to C-a (screen-style)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── Key bindings ──────────────────────────────────────────────────────────────
# Reload config
; bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Copy mode ─────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel